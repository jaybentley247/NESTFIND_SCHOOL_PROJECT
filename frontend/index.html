<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestFind — Find your next home</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Sets the theme before the page draws, so there's no white flash in
         dark mode. Same rules as src/context/ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("nestfind-theme");
          var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <!-- Home page splash loader (markup at the top of <body>). Plain CSS so it
         shows before the app's own styles and scripts have loaded. -->
    <link rel="preload" as="image" href="/Arowwai-red.png" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ffffff;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      html.dark #splash { background: #0f172a; }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      #splash img { width: 200px; height: auto; animation: splash-pulse 1.4s ease-in-out infinite; }
      #splash .splash-bar { width: 160px; height: 4px; overflow: hidden; border-radius: 9999px; background: rgba(220, 38, 38, 0.15); }
      #splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 9999px; background: #dc2626; animation: splash-slide 1.1s ease-in-out infinite; }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.85; } }
      @keyframes splash-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .splash-bar span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading NestFind">
      <img src="/Arowwai-red.png" alt="NestFind" />
      <div class="splash-bar"><span></span></div>
    </div>
    <script>
      // Only the home page shows the loader. It stays at least 900ms so it
      // doesn't just flicker, fades out once the page has loaded, and never
      // stays longer than 6 seconds, even on a slow connection.
      (function () {
        var splash = document.getElementById("splash");
        if (window.location.pathname !== "/") {
          splash.remove();
          return;
        }
        var shownAt = Date.now();
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          var wait = Math.max(0, 900 - (Date.now() - shownAt));
          setTimeout(function () {
            splash.classList.add("splash-hide");
            setTimeout(function () { splash.remove(); }, 450);
          }, wait);
        }
        if (document.readyState === "complete") hide();
        else window.addEventListener("load", hide);
        setTimeout(hide, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
